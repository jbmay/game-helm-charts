# Default values for enshrouded.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Consumed by the bjw-s common library. alwaysAppendIdentifierToResourceName keeps
# claims named <fullname>-<key> even when only one of them is enabled, which is what
# the deployment below references and what the k8s-at-home library used to produce.
global:
  alwaysAppendIdentifierToResourceName: true

replicaCount: 1

image:
  repository: sknnr/enshrouded-dedicated-server
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsUser: 10000
  runAsGroup: 10000

enshrouded:
  tty: true
  stdin: false

  service:
    type: NodePort
    port: 15636
    #nodePort:
    annotations: {}
  query:
    type: NodePort
    port: 15637
    #nodePort:
    annotations: {}

  env:

  config:
    maxPlayers: 16
    serverName: "Enshrouded Server"
    serverPassword: "fakePass"
    gamePort: 15636
    queryPort: 15637


resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  game:
    enabled: true
    mountPath: /home/steam/enshrouded
    accessMode: ReadWriteOnce
    size: 10Gi
