{{- if and .Values.saveImport.enabled (empty .Values.saveImport.image) }}
{{- fail "saveImport.image is required when saveImport.enabled=true" }}
{{- end }}
{{- if and .Values.saveImport.enabled .Values.import_save.enabled }}
{{- fail "Disable import_save.enabled when using saveImport.enabled" }}
{{- end }}
{{- if and .Values.saveImport.enabled (not (semverCompare ">=1.31.0-0" .Capabilities.KubeVersion.Version)) }}
{{- fail "Save image imports require Kubernetes 1.31+ with image-volume support" }}
{{- end }}
{{- if and .Values.mods.syncFromSave .Values.factorioServer.update_mods_on_start }}
{{- fail "Disable factorioServer.update_mods_on_start when using mods.syncFromSave" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "factorio-server-charts.fullname" . }}
  labels:
    app: {{ template "factorio-server-charts.fullname" . }}
    chart: {{ template "factorio-server-charts.fullname" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ template "factorio-server-charts.fullname" . }}
  strategy:
{{ toYaml .Values.strategy | indent 4 }}
  template:
    metadata:
      labels:
        app: {{ template "factorio-server-charts.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostNetwork: {{ .Values.service.hostNetwork }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: '1'
      initContainers:
        {{- if .Values.saveImport.enabled }}
        - name: import-save-image
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-ec"]
          args:
            - |
              mkdir -p /factorio/saves /factorio/.save-imports
              marker="/factorio/.save-imports/{{ printf "%s|%v" .Values.saveImport.image .Values.saveImport.overwrite | sha256sum | trunc 16 }}"
              if [ -f "$marker" ]; then
                echo "Save import already completed."
                exit 0
              fi
              found=false
              for source in /save-import/*.zip; do
                [ -f "$source" ] || continue
                found=true
                destination="/factorio/saves/$(basename "$source")"
                {{- if not .Values.saveImport.overwrite }}
                if [ -e "$destination" ]; then
                  echo "Preserving existing save: $destination"
                  continue
                fi
                {{- end }}
                cp "$source" "$destination"
              done
              if [ "$found" != true ]; then
                echo "No save ZIP files found at image root" >&2
                exit 1
              fi
              {{- include "factorio-server-charts.chownDataDir" . | nindent 14 }}
              touch "$marker"
              echo "Save import completed."
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: datadir
              mountPath: /factorio
            - name: save-import
              mountPath: /save-import
              readOnly: true
        {{- end }}
        - name: volume-permissions-serversettingsconfig
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy:  {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p /factorio/configs
              mkdir -p /factorio/config
              cp --verbose /deployed-configs/* /factorio/configs
              if [ -f "/rcon-pw/rconpw" ]; then
                cp --verbose /rcon-pw/rconpw /factorio/configs/rconpw
              fi
              if [ -f "/account/username" ]; then
                jq -M --rawfile username /account/username '.username=($username|gsub("[\\n\\t]"; ""))' /factorio/configs/server-settings.json > /tmp/server-settings.json && mv /tmp/server-settings.json /factorio/configs/server-settings.json
                if [ -f "/account/password" ]; then
                  jq -M --rawfile password /account/password '.password=($password|gsub("[\\n\\t]"; ""))' /factorio/configs/server-settings.json > /tmp/server-settings.json && mv /tmp/server-settings.json /factorio/configs/server-settings.json
                fi
                if [ -f "/account/token" ]; then
                  jq -M --rawfile token /account/token '.token=($token|gsub("[\\n\\t]"; ""))' /factorio/configs/server-settings.json > /tmp/server-settings.json && mv /tmp/server-settings.json /factorio/configs/server-settings.json
                fi
              fi
              if [ -f "/gamePassword/game_password" ]; then
                jq -M --rawfile game_password /gamePassword/game_password '.game_password=($game_password|gsub("[\\n\\t]"; ""))' /factorio/configs/server-settings.json > /tmp/server-settings.json && mv /tmp/server-settings.json /factorio/configs/server-settings.json
              fi
              #sleep 100
              {{- include "factorio-server-charts.chownDataDir" . | nindent 14 }}
              chmod -vR 777 /factorio/configs
              ls -alth /factorio
          {{- with .Values.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: datadir
              mountPath: /factorio
            - name: {{ template "factorio-server-charts.fullname" . }}-serversettingsconfig
              mountPath: /deployed-configs
            {{- if or (.Values.rcon.password) (.Values.rcon.passwordSecret) }}
            - name: rcon
              mountPath: /rcon-pw
            {{- end }}
            {{- if or (.Values.account.accountSecret) (.Values.account.username) }}
            - name: account-data
              mountPath: /account
            {{- end }}
            {{- if or (.Values.serverPassword.game_password) (.Values.serverPassword.passwordSecret) }}
            - name: game-password
              mountPath: /gamePassword
            {{- end }}
        {{- if and .Values.mods.enabled (not .Values.mods.syncFromSave) }}
        - name: download-factorio-mods
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy:  {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p /factorio/mods
              bash /scripts/mod-downloader.sh
              {{- include "factorio-server-charts.chownDataDir" . | nindent 14 }}
          {{- with .Values.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: datadir
              mountPath: /factorio
            - name: {{ template "factorio-server-charts.fullname" . }}-mod-downloader-configmap
              mountPath: /scripts
            {{- if or (.Values.account.accountSecret) (.Values.account.username) }}
            - name: account-data
              mountPath: /account
            {{- end }}
        {{- end }}
        {{- if .Values.import_save.enabled }}
        - name: import-factorio-save
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy:  {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
            - |
              bash /scripts/save-importer.sh
              {{- include "factorio-server-charts.chownDataDir" . | nindent 14 }}
          {{- with .Values.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: datadir
              mountPath: /factorio
            - name: {{ template "factorio-server-charts.fullname" . }}-save-importer-configmap
              mountPath: /scripts
        {{- end }}
        {{- if .Values.mods.syncFromSave }}
        - name: sync-save-mods
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-ec", "bash /scripts/sync-save-mods.sh"]
          env:
            - name: SAVE_NAME
              value: {{ .Values.factorioServer.save_name | quote }}
            - name: LOAD_LATEST_SAVE
              value: {{ .Values.factorioServer.load_latest_save | quote }}
          securityContext:
            {{- toYaml .Values.initContainerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: datadir
              mountPath: /factorio
            - name: {{ template "factorio-server-charts.fullname" . }}-mod-downloader-configmap
              mountPath: /scripts
            - name: save-selection
              mountPath: /save-selection
            {{- if or (.Values.account.accountSecret) (.Values.account.username) }}
            - name: account-data
              mountPath: /account
              readOnly: true
            {{- end }}
        {{- end }}
      containers:
      - name: {{ template "factorio-server-charts.fullname" . }}
        {{- if .Values.mods.syncFromSave }}
        # Start exactly the save selected by the init container. In particular,
        # do not generate a new named save that supersedes a resumed autosave.
        command: ["/bin/bash", "-ec"]
        args:
          - |
            IFS= read -r SAVE_NAME < /save-selection/name
            export SAVE_NAME LOAD_LATEST_SAVE=false GENERATE_NEW_SAVE=false
            exec /docker-entrypoint.sh
        {{- end }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          exec:
            command:
              - /bin/bash
              - -ec
              - '/bin/ps aux | /bin/grep -v grep | /bin/grep factorio'
          periodSeconds: 10
          initialDelaySeconds: 5
          failureThreshold: 3
        ports:
        - name: factorio
          containerPort: {{ include "factorio-server-charts.gamePort" . }}
          protocol: UDP
        - containerPort: 27015
          protocol: TCP
        resources:
{{ toYaml .Values.resources | indent 10 }}
        volumeMounts:
          {{- if .Values.mods.syncFromSave }}
          - name: save-selection
            mountPath: /save-selection
            readOnly: true
          {{- end }}
          {{- if or (.Values.account.accountSecret) (.Values.account.username) }}
          - name: account-data
            mountPath: /account
          {{- end }}
          - name: datadir
            mountPath: /factorio
        env:
        # When the container starts as root the entrypoint remaps its internal
        # `factorio` user to these ids, chowns /factorio and drops privileges to
        # it. When it starts as non-root the entrypoint skips all of that and the
        # process simply runs as the pod's runAsUser, which should match these.
        - name: PUID
          value: {{ .Values.puid | quote }}
        - name: PGID
          value: {{ .Values.pgid | quote }}
        - name: UPDATE_MODS_ON_START
          value: {{ .Values.factorioServer.update_mods_on_start | quote }}
        - name: INSTANCE_NAME
          value: {{ .Values.server_settings.name | quote }}
        - name: INSTANCE_DESC
          value: {{ .Values.server_settings.description | quote }}
        - name: SAVE_NAME
          value: {{ .Values.factorioServer.save_name | quote }}
        - name: GENERATE_NEW_SAVE
          value: {{ .Values.factorioServer.generate_new_save | quote }}
        - name: LOAD_LATEST_SAVE
          value: {{ .Values.factorioServer.load_latest_save | quote }}
        - name: CONFIG
          value: /factorio/configs
        - name: PORT
          value: {{ include "factorio-server-charts.gamePort" . | quote }}
        - name: BIND
          # The image already supplies --port; Factorio rejects a second port
          # in --bind, so pass only the address here.
          value: {{ .Values.factorioServer.bindAddress | quote }}
{{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
    {{- end }}
      volumes:
        {{- if .Values.mods.syncFromSave }}
        - name: save-selection
          emptyDir: {}
        {{- end }}
        {{- if .Values.saveImport.enabled }}
        - name: save-import
          image:
            reference: {{ .Values.saveImport.image | quote }}
            pullPolicy: Always
        {{- end }}
        {{- if or (.Values.account.accountSecret) (.Values.account.username) }}
        - name: account-data
          secret:
          {{- if .Values.account.accountSecret }}
            secretName: {{ .Values.account.accountSecret }}
          {{- else}}
            secretName: {{ template "factorio-server-charts.fullname" . }}-account
          {{- end }}
        {{- end }}
        {{- if or (.Values.rcon.password) (.Values.rcon.passwordSecret) }}
        - name: rcon
          secret:
            {{- if .Values.rcon.passwordSecret }}
            secretName: {{ .Values.rcon.passwordSecret }}
            {{- else }}
            secretName: {{ template "factorio-server-charts.fullname" . }}-rcon
            {{- end }}
        {{- end }}
        {{- if or (.Values.serverPassword.game_password) (.Values.serverPassword.passwordSecret) }}
        - name: game-password
          secret:
            {{- if .Values.serverPassword.passwordSecret }}
            secretName: {{ .Values.serverPassword.passwordSecret }}
            {{- else }}
            secretName: {{ template "factorio-server-charts.fullname" . }}-password
            {{- end }}
        {{- end }}
        - name: datadir
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ if .Values.persistence.dataDir.existingClaim }} {{.Values.persistence.dataDir.existingClaim}} {{ else }}{{ template "factorio-server-charts.fullname" . }}-datadir {{ end }}
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: {{ template "factorio-server-charts.fullname" . }}-serversettingsconfig
          configMap:
            name: {{ template "factorio-server-charts.fullname" . }}-serversettingsconfig
        - name: {{ template "factorio-server-charts.fullname" . }}-mod-downloader-configmap
          configMap:
            name: {{ template "factorio-server-charts.fullname" . }}-mod-downloader-configmap
        - name: {{ template "factorio-server-charts.fullname" . }}-save-importer-configmap
          configMap:
            name: {{ template "factorio-server-charts.fullname" . }}-save-importer-configmap
