apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "factorio-server-charts.fullname" . }}-mod-downloader-configmap
  labels:
    app: {{ template "factorio-server-charts.fullname" . }}
    chart: {{ template "factorio-server-charts.fullname" . }}
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
  sync-save-mods.sh: |
    #!/bin/bash
    set -euo pipefail
    if [ "${LOAD_LATEST_SAVE:-false}" = true ]; then
      save=""
      for candidate in /factorio/saves/*.zip; do
        [ -f "$candidate" ] || continue
        case "$candidate" in *.tmp.zip) continue ;; esac
        if [ -z "$save" ] || [ "$candidate" -nt "$save" ]; then
          save="$candidate"
        fi
      done
    else
      case "$SAVE_NAME" in
        ""|*/*|*\\*) echo "SAVE_NAME must be a filename without .zip" >&2; exit 1 ;;
      esac
      save="/factorio/saves/${SAVE_NAME}.zip"
    fi
    if [ ! -f "$save" ]; then
      echo "Cannot synchronize mods: selected save does not exist: $save" >&2
      exit 1
    fi
    mkdir -p /factorio/mods
    sync_dir=$(mktemp -d /tmp/factorio-mod-sync.XXXXXX)
    trap 'rm -rf -- "$sync_dir"' EXIT
    chmod 700 "$sync_dir"
    printf '[path]\nread-data=/opt/factorio/data\nwrite-data=%s\n' "$sync_dir" > "$sync_dir/config.ini"
    if [ -f /account/username ] || [ -f /account/token ]; then
      if [ ! -s /account/username ] || [ ! -s /account/token ]; then
        echo "Mod Portal downloads require both username and token keys in the account Secret" >&2
        exit 1
      fi
      umask 077
      jq -n --rawfile username /account/username --rawfile token /account/token \
        '{"service-username": ($username | gsub("[\\r\\n]"; "")), "service-token": ($token | gsub("[\\r\\n]"; ""))}' \
        > "$sync_dir/player-data.json"
    fi
    echo "Synchronizing mods from $save"
    exec_prefix=()
    if [ -f /bin/box64 ]; then exec_prefix=(/bin/box64); fi
    "${exec_prefix[@]}" /opt/factorio/bin/x64/factorio \
      --config "$sync_dir/config.ini" --mod-directory /factorio/mods --sync-mods "$save"
    {{- include "factorio-server-charts.chownDataDir" . | nindent 4 }}
    mkdir -p /save-selection
    selected_name=$(basename "$save" .zip)
    printf '%s\n' "$selected_name" > /save-selection/name
    chmod 644 /save-selection/name
    echo "Save mod synchronization completed."
  # credit to the factoriotools/factorio-docker team, most of this logic came from them
  # https://github.com/factoriotools/factorio-docker/blob/master/docker/files/update-mods.sh
  mod-downloader.sh: |
    #!/bin/bash
    set -euo pipefail
    modDir=/factorio/mods
    MOD_BASE_URL="https://mods.factorio.com"
    portalMods=$(cat <<'FACTORIO_PORTAL_MODS_JSON'
    {{ .Values.mods.portal | toJson }}
    FACTORIO_PORTAL_MODS_JSON
    )
    # Keep names as data rather than interpolating them into shell commands.
    jq -e 'type == "array" and all(.[];
      if type == "string" then length > 0
      elif type == "object" then
        (.name | type == "string" and length > 0) and
        ((has("version") | not) or (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")))
      else false end)' <<< "$portalMods" >/dev/null || {
      echo "mods.portal entries must be names or objects with name and optional version (quoted major.minor.patch)" >&2
      exit 1
    }
    mapfile -t officialMods < <(jq -c '.[] | if type == "string" then {name: .} else . end' <<< "$portalMods")
    declare -A unofficialMods
    {{- range .Values.mods.unofficial }}
    unofficialMods[{{ .name | quote}}]={{ .url | quote}}
    {{- end }}
    function downloadUnofficial() {
      (cd "$modDir"; curl -fL -o "$2" "$1")
    }
    function downloadofficial() {
      local name="$1" requested_version="$2"
      local metadata release filename url sha1 actual_version http_status list_tmp
      echo "Selecting $name ${requested_version:-latest compatible}"
      metadata=$(curl --fail --silent --show-error "$MOD_BASE_URL/api/mods/$name")
      release=$(jq -c --arg game_version "$VERSION" --arg requested "$requested_version" '
        [.releases[]
          | select((.info_json.factorio_version | split(".")[:2]) == ($game_version | split(".")[:2]))
          | select($requested == "" or .version == $requested)]
        | last // empty' <<< "$metadata")
      if [ -z "$release" ]; then
        echo "No compatible release for $name ${requested_version:-latest} on Factorio $VERSION" >&2
        return 1
      fi
      filename=$(jq -er '.file_name' <<< "$release")
      url=$(jq -er '.download_url' <<< "$release")
      sha1=$(jq -er '.sha1' <<< "$release")
      actual_version=$(jq -er '.version' <<< "$release")
      echo "Downloading $filename"
      # Do not print the authenticated URL: it contains the Mod Portal token.
      http_status=$(curl --silent --show-error -L -w "%{http_code}" \
        -o "$modDir/$filename" "$MOD_BASE_URL$url?username=$USERNAME&token=$TOKEN")
      if [ "$http_status" != 200 ]; then
        echo "Download failed for $name: HTTP $http_status" >&2
        rm -f -- "$modDir/$filename"
        return 1
      fi
      if ! printf '%s  %s\n' "$sha1" "$modDir/$filename" | sha1sum --check --status; then
        echo "SHA1 mismatch for $name" >&2
        rm -f -- "$modDir/$filename"
        return 1
      fi
      # A newer ZIP may already exist on the PVC. Pin exact versions explicitly,
      # but clear old pins for latest entries so the startup updater can update them.
      if [ ! -f "$modDir/mod-list.json" ]; then
        printf '%s\n' '{"mods":[]}' > "$modDir/mod-list.json"
      fi
      list_tmp=$(mktemp "$modDir/mod-list.json.XXXXXX")
      if ! jq --arg name "$name" --arg version "$requested_version" '
        def selected:
          . + {enabled: true} |
          if $version == "" then del(.version) else . + {version: $version} end;
        .mods = ((.mods // []) | if any(.[]; .name == $name) then
          map(if .name == $name then selected else . end)
        else . + [({name: $name} | selected)] end)
        ' "$modDir/mod-list.json" > "$list_tmp"; then
        rm -f -- "$list_tmp"
        return 1
      fi
      mv -- "$list_tmp" "$modDir/mod-list.json"
      echo "Enabled $name $actual_version"
    }
    mkdir -p "$modDir"
    for key in "${!unofficialMods[@]}"; do
      downloadUnofficial "${unofficialMods[$key]}" "$key"
    done
    if [ "${#officialMods[@]}" -gt 0 ]; then
      USERNAME="${USERNAME:-$(cat /account/username)}"
      TOKEN="${TOKEN:-$(cat /account/token)}"
      if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
        echo "Mod Portal downloads require a Factorio username and token" >&2
        exit 1
      fi
      for officialMod in "${officialMods[@]}"; do
        name=$(jq -r '.name' <<< "$officialMod")
        requested_version=$(jq -r '.version // ""' <<< "$officialMod")
        downloadofficial "$name" "$requested_version"
      done
    fi
