# Default values for starrupture.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/loganintech/starrupture
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

starrupture:
  # Server configuration
  server:
    # Game port (TCP/UDP)
    port: 7777
    # Steam query port (UDP)
    queryPort: 27015
    # Network interface to bind
    multihome: "0.0.0.0"
    # Update server files on container start
    updateOnStart: true
    # Validate all files via SteamCMD (slower but thorough)
    validateOnStart: false
    # Additional command-line arguments for the server
    additionalArgs: ""

  # DSSettings.txt configuration for auto-start
  # If sessionName is set, DSSettings.txt will be generated and server will auto-start
  session:
    # Server name displayed in server browser
    name: ""
    # Save game name (defaults to session name if empty)
    saveGameName: ""
    # Autosave interval in seconds
    saveInterval: 300
    # Start a new game on launch
    startNewGame: false
    # Load existing save on launch
    loadSavedGame: false

  # Server admin password
  adminPassword: ""

  service:
    type: NodePort
    # Node port for game traffic
    gameNodePort: ""
    # Node port for query traffic
    queryNodePort: ""
    annotations: {}

# StarRupture is very RAM hungry - can use ~22GB RAM
# Recommend at least 16GB for larger bases
resources:
  requests:
    memory: "8Gi"
    cpu: "2000m"
  limits:
    memory: "24Gi"
    cpu: "4000m"

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  data:
    enabled: true
    mountPath: /home/steam/server
    accessMode: ReadWriteOnce
    size: 50Gi
    # existingClaim: ""
    # storageClass: ""
