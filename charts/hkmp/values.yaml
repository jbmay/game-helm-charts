# Default values for hkmp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Consumed by the bjw-s common library. alwaysAppendIdentifierToResourceName keeps
# claims named <fullname>-<key> even when only one of them is enabled, which is what
# the deployment below references and what the k8s-at-home library used to produce.
global:
  alwaysAppendIdentifierToResourceName: true

replicaCount: 1

image:
  repository: maximalmax90/hkmpserver
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

hkmp:
  tty: true
  stdin: false
  service:
    type: NodePort
    port: 2222
    annotations: {}
  args:
  env:
    - PORT=2222

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  config:
    enabled: true
    mountPath: /hkmp
    accessMode: ReadWriteOnce
    size: 2Gi
