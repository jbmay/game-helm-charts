# Default values for core-keeper-dedicated-server.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: escaping/core-keeper-dedicated
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

corekeeper:
  tty: false
  stdin: false
  service:
    enabled: true
    type: NodePort
    port: 2875
    nodePort: 0

  config:
    worldIndex: 0
    worldName: "Core Keeper Dedicated Server"
    worldSeed: 0 # Leave as 0 for random seed
    difficulty: normal # normal, hard, creative, casual
    gameID: "" # LEave empty for random game ID
    maxPlayers: 10
    discord:
      enabled: false
      webhook: ""
      printFormat: "%s"
    seasonOverride: "-1"
    # Overrides current season by setting to any of None (0), Easter (1), Halloween (2), Christmas (3), Valentine (4), Anniversary (5), CherryBlossom (6), LunarNewYear(7). -1 is default setting where it is set depending on system date.
    serverIP: 0.0.0.0
    serverGamePort: 2875


resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  data:
    enabled: false
    mountPath: /home/steam/core-keeper-data
    accessMode: ReadWriteOnce
    size: 1Gi
  config:
    enabled: false
    mountPath: /home/steam/core-keeper-dedicated
    accessMode: ReadWriteOnce
    size: 1Gi

