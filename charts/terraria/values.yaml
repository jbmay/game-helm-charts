# Default values for terraria.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Consumed by the bjw-s common library. alwaysAppendIdentifierToResourceName keeps
# claims named <fullname>-<key> even when only one of them is enabled, which is what
# the deployment below references and what the k8s-at-home library used to produce.
global:
  alwaysAppendIdentifierToResourceName: true

replicaCount: 1

# Server type: "tshock" or "vanilla"
# - tshock: Uses ghcr.io/jbmay/terraria-tshock (full TShock features)
# - vanilla: Uses ghcr.io/jbmay/terraria-vanilla (pure vanilla server)
serverType: tshock

image:
  # Default: TShock 6.1.0 for Terraria 1.4.5.8, packaging revision 1.
  # For vanilla, use repository ghcr.io/jbmay/terraria-vanilla and tag
  # 1.4.5.8-build.1. Versioned tags contain the server binary and avoid a
  # deployment-time download.
  repository: ghcr.io/jbmay/terraria-tshock
  tag: 6.1.0-build.1
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

rest:
  enabled: false
  service:
    type: NodePort
    port: 7777
    # nodePort:
    annotations: {}

terraria:
  tty: false
  stdin: false
  service:
    type: NodePort
    port: 7777
    nodePort: 307777
    annotations: {}
  args:

  serverSettings:
    # Server settings are sourced from vanilla server settings https://terraria.fandom.com/wiki/Server#Command_line_parameters
    # The ones defined below should be set, but you can add the rest under extraServerSettings
    worldsize: large                           # 1: small, 2: medium, 3: large
    difficulty: master                         # 0: normal, 1: expert, 2: master, 3: journey
    worldname: "large-master-world"            # Name of the world to create if it doesn't exist already
    maxplayers: 8                              # Max number of players
    banlist: "banlist.txt"                     # Location of the banlist file
    secure: 1                                  # Cheat protection (1 for enabled)
    language: "en-US"                          # Server language
    npcstream: 60                              # Reduces enemy skipping
    priority: 1                                # System priority (0: Realtime, 1: High, ...)

  extraServerSettings: {}

  tshockSettings:
    InvasionMultiplier: 1
    DefaultMaximumSpawns: 5
    DefaultSpawnRate: 600
    ServerPort: 7777
    EnableWhitelist: false
    InfiniteInvasion: false
    PvPMode: normal
    SpawnProtection: true
    SpawnProtectionRadius: 10
    MaxSlots: 8
    RangeChecks: true
    DisableBuild: false
    SuperAdminChatRGB: [255, 0, 0]
    SuperAdminChatPrefix: "(Admin) "
    SuperAdminChatSuffix: ""
    BackupInterval: 0
    BackupKeepFor: 60
    RememberLeavePos: false
    HardcoreOnly: false
    MediumcoreOnly: false
    KickOnMediumcoreDeath: false
    BanOnMediumcoreDeath: false
    AutoSave: true
    AnnounceSave: true
    MaximumLoginAttempts: 3
    ServerName: ""
    UseServerName: false
    StorageType: sqlite
    MySqlHost: localhost:3306
    MySqlDbName: ""
    MySqlUsername: ""
    MySqlPassword: ""
    MediumcoreBanReason: Death results in a ban
    MediumcoreKickReason: Death results in a kick
    EnableIPBans: true
    EnableUUIDBans: true
    EnableBanOnUsernames: false
    DefaultRegistrationGroupName: default
    DefaultGuestGroupName: guest
    DisableSpewLogs: true
    DisableSecondUpdateLogs: false
    HashAlgorithm: sha512
    ServerFullReason: Server is full
    WhitelistKickReason: You are not on the whitelist.
    ServerFullNoReservedReason: Server is full. No reserved slots open.
    SaveWorldOnCrash: true
    EnableGeoIP: false
    EnableTokenEndpointAuthentication: false
    RestApiEnabled: true
    RestApiPort: 7878
    DisableTombstones: true
    DisplayIPToAdmins: false
    KickProxyUsers: true
    DisableHardmode: false
    DisableDungeonGuardian: false
    DisableClownBombs: false
    DisableSnowBalls: false
    ChatFormat: "{1}{2}{3}: {4}"
    ChatAboveHeadsFormat: "{2}"
    ForceTime: normal
    TileKillThreshold: 60
    TilePlaceThreshold: 20
    TileLiquidThreshold: 15
    ProjectileThreshold: 50
    HealOtherThreshold: 50
    ProjIgnoreShrapnel: true
    RequireLogin: false
    DisableInvisPvP: false
    MaxRangeForDisabled: 10
    ServerPassword: ""
    RegionProtectChests: false
    RegionProtectGemLocks: true
    DisableLoginBeforeJoin: false
    DisableUUIDLogin: false
    KickEmptyUUID: false
    AllowRegisterAnyUsername: false
    AllowLoginAnyUsername: true
    MaxDamage: 1175
    MaxProjDamage: 1175
    KickOnDamageThresholdBroken: false
    IgnoreProjUpdate: false
    IgnoreProjKill: false
    IgnoreNoClip: false
    AllowIce: false
    AllowCrimsonCreep: true
    AllowCorruptionCreep: true
    AllowHallowCreep: true
    StatueSpawn200: 3
    StatueSpawn600: 6
    StatueSpawnWorld: 10
    PreventBannedItemSpawn: false
    PreventDeadModification: true
    EnableChatAboveHeads: false
    ForceXmas: false
    AllowAllowedGroupsToSpawnBannedItems: false
    IgnoreChestStacksOnLoad: false
    LogPath: logs
    UseSqlLogs: false
    RevertToTextLogsOnSqlFailures: 10
    PreventInvalidPlaceStyle: true
    BroadcastRGB: [127, 255, 212]
    ApplicationRestTokens: {}
    ReservedSlots: 20
    LogRest: false
    RespawnSeconds: 5
    RespawnBossSeconds: 10
    TilePaintThreshold: 15
    ForceHalloween: false
    AllowCutTilesAndBreakables: false
    CommandSpecifier: "/"
    CommandSilentSpecifier: "."
    KickOnHardcoreDeath: false
    BanOnHardcoreDeath: false
    HardcoreBanReason: Death results in a ban
    HardcoreKickReason: Death results in a kick
    AnonymousBossInvasions: true
    MaxHP: 500
    MaxMP: 200
    SaveWorldOnLastPlayerExit: true
    BCryptWorkFactor: 7
    MinimumPasswordLength: 4
    RESTMaximumRequestsPerInterval: 5
    RESTRequestBucketDecreaseIntervalMinutes: 1
    RESTLimitOnlyFailedLoginRequests: true
    ShowBackupAutosaveMessages: true

resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Optionally import existing Terraria worlds from an OCI image volume before
# the server starts. Image volumes require Kubernetes 1.31+ and a compatible
# container runtime; the ImageVolume feature gate may also need to be enabled
# before Kubernetes 1.36. Prefer an immutable digest in image.reference.
worldImport:
  enabled: false
  image:
    # Expected layout: <sourcePath>/*.wld (backups and related files may also
    # be included). Example: ghcr.io/example/terraria-worlds@sha256:...
    reference: ""
    pullPolicy: IfNotPresent
  sourcePath: /worlds
  # Existing destination paths are preserved by default. When true, source
  # paths replace matching content once for each unique import configuration.
  overwrite: false
  copier:
    image: busybox:1.36
    pullPolicy: IfNotPresent
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources: {}

persistence:
  worlds:
    enabled: false
    # existingClaim: ""  # Use an existing PVC instead of creating one
    mountPath: /worlds
    accessMode: ReadWriteOnce
    size: 1Gi
  config:
    enabled: false
    # existingClaim: ""
    mountPath: /config
    accessMode: ReadWriteOnce
    size: 1Gi
  plugins:
    enabled: false
    # existingClaim: ""
    mountPath: /tshock/ServerPlugins
    accessMode: ReadWriteOnce
    size: 1Gi
  logs:
    enabled: false
    # existingClaim: ""
    mountPath: /tshock/logs
    accessMode: ReadWriteOnce
    size: 1Gi
