{{- if .Values.worldImport.enabled }}
{{- if empty .Values.worldImport.image.reference }}
{{- fail "worldImport.image.reference is required when worldImport.enabled=true" }}
{{- end }}
{{- if not (hasPrefix "/" .Values.worldImport.sourcePath) }}
{{- fail "worldImport.sourcePath must be an absolute path" }}
{{- end }}
{{- if regexMatch `(^|/)\.\.(/|$)` .Values.worldImport.sourcePath }}
{{- fail "worldImport.sourcePath must not contain '..' path segments" }}
{{- end }}
{{- if not (semverCompare ">=1.31.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail "worldImport requires Kubernetes 1.31 or newer with image volume support" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "terraria.fullname" . }}
  labels:
{{ include "terraria.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "terraria.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- if and (eq .Values.serverType "tshock") .Values.terraria.tshockSettings }}
      annotations:
        checksum/tshock-config: {{ include (print $.Template.BasePath "/secret-tshock.yaml") . | sha256sum }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "terraria.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        {{- if .Values.worldImport.enabled }}
        - name: import-worlds
          image: {{ .Values.worldImport.copier.image | quote }}
          imagePullPolicy: {{ .Values.worldImport.copier.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          env:
            - name: WORLD_IMPORT_SOURCE_PATH
              value: {{ .Values.worldImport.sourcePath | quote }}
          args:
            - |
              SOURCE_DIR="/world-import${WORLD_IMPORT_SOURCE_PATH}"
              MARKER_DIR="/worlds/.world-imports"
              MARKER_FILE="${MARKER_DIR}/{{ printf "%s|%s|%v" .Values.worldImport.image.reference .Values.worldImport.sourcePath .Values.worldImport.overwrite | sha256sum | trunc 16 }}"

              if [ -f "${MARKER_FILE}" ]; then
                echo "World import has already completed for this source."
                exit 0
              fi
              if [ ! -d "${SOURCE_DIR}" ]; then
                echo "ERROR: World import source directory does not exist: ${SOURCE_DIR}" >&2
                exit 1
              fi
              if ! find "${SOURCE_DIR}" -type f -name '*.wld' -print | grep -q .; then
                echo "ERROR: No .wld files found beneath ${SOURCE_DIR}" >&2
                exit 1
              fi

              mkdir -p /worlds "${MARKER_DIR}"
              {{- if .Values.worldImport.overwrite }}
              echo "Importing world data and replacing matching destination paths..."
              cp -R "${SOURCE_DIR}/." /worlds/
              {{- else }}
              echo "Importing world data without replacing existing destination paths..."
              for source in "${SOURCE_DIR}"/* "${SOURCE_DIR}"/.[!.]* "${SOURCE_DIR}"/..?*; do
                [ -e "${source}" ] || continue
                destination="/worlds/$(basename "${source}")"
                if [ -e "${destination}" ]; then
                  echo "Preserving existing path: ${destination}"
                  continue
                fi
                cp -R "${source}" /worlds/
              done
              {{- end }}
              for destination in /worlds/* /worlds/.[!.]* /worlds/..?*; do
                [ -e "${destination}" ] || continue
                chmod -R u+rwX,g+rwX "${destination}"
              done
              touch "${MARKER_FILE}"
              echo "World import completed."
          securityContext:
            {{- toYaml .Values.worldImport.copier.securityContext | nindent 12 }}
          volumeMounts:
            - name: world-import
              mountPath: /world-import
              readOnly: true
            - name: terraria-worlds
              mountPath: /worlds
          resources:
            {{- toYaml .Values.worldImport.copier.resources | nindent 12 }}
        {{- end }}
        {{- if and (eq .Values.serverType "tshock") .Values.terraria.tshockSettings }}
        - name: init-tshockconfig
          image: busybox:1.36
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /config/config.json ]; then
                cp /tshock-config/config.json /config/config.json
              fi
              chmod 644 /config/config.json
          volumeMounts:
            - name: tshock-config
              mountPath: /tshock-config
              readOnly: true
            - name: terraria-config
              mountPath: /config
        {{- end }}
        - name: init-serverconfig
          image: busybox:1.36
          command: ['sh']
          args:
            - -c
            - |
              if [ ! -f /config/serverconfig.txt ]; then
                touch /config/serverconfig.txt
                {{- if .Values.terraria.extraServerSettings }}
                {{- range $key, $value := .Values.terraria.extraServerSettings }}
                echo "{{ $key }}={{ $value }}" >> /config/serverconfig.txt
                {{- end }}
                {{- end }}
                echo "autocreate={{ include "terraria.worldsize" . }}" >> /config/serverconfig.txt
                echo "difficulty={{ include "terraria.difficulty" . }}" >> /config/serverconfig.txt
                echo "world=/worlds/{{ .Values.terraria.serverSettings.worldname }}.wld" >> /config/serverconfig.txt
                echo "worldname={{ .Values.terraria.serverSettings.worldname }}" >> /config/serverconfig.txt
                echo "maxplayers={{ .Values.terraria.serverSettings.maxplayers }}" >> /config/serverconfig.txt
                echo "secure={{ .Values.terraria.serverSettings.secure }}" >> /config/serverconfig.txt
                echo "language={{ .Values.terraria.serverSettings.language }}" >> /config/serverconfig.txt
                echo "npcstream={{ .Values.terraria.serverSettings.npcstream }}" >> /config/serverconfig.txt
                echo "priority={{ .Values.terraria.serverSettings.priority }}" >> /config/serverconfig.txt
              fi
              chmod 644 /config/serverconfig.txt
          volumeMounts:
          - name: terraria-config
            mountPath: /config
    {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      serviceAccountName: {{ template "terraria.serviceAccountName" . }}
      {{- if .Values.podSecurityContext }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            - name: CONFIG_PATH
              value: /config
            {{- if .Values.terraria.env }}
            {{- toYaml .Values.terraria.env | nindent 12 }}
            {{- end }}
          {{- if .Values.securityContext }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          tty: {{ .Values.terraria.tty }}
          stdin: {{ .Values.terraria.stdin }}
          args:
            {{- if .Values.terraria.args }}
            {{- toYaml .Values.terraria.args | nindent 12 }}
            {{- end }}
          ports:
            - name: server
              containerPort: 7777
              protocol: TCP
            - name: http
              containerPort: 7878
              protocol: TCP
            {{- range .Values.terraria.extraPorts }}
            {{- if .service.enabled }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              {{- if .protocol }}
              protocol: {{ .protocol }}
              {{- else }}
              protocol: TCP
              {{- end }}
            {{- end }}
            {{- end }}
          volumeMounts:
          - name: terraria-worlds
            mountPath: /worlds
          - name: terraria-config
            mountPath: /config
          {{- if eq .Values.serverType "tshock" }}
          - name: tshock-plugins
            mountPath: /tshock/ServerPlugins
          - name: tshock-logs
            mountPath: /tshock/logs
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      {{- if .Values.worldImport.enabled }}
      - name: world-import
        image:
          reference: {{ .Values.worldImport.image.reference | quote }}
          pullPolicy: {{ .Values.worldImport.image.pullPolicy }}
      {{- end }}
      - name: terraria-worlds
      {{- if .Values.persistence.worlds.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.worlds.existingClaim | default (printf "%s-worlds" (include "terraria.fullname" .)) }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      - name: terraria-config
      {{- if .Values.persistence.config.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.config.existingClaim | default (printf "%s-config" (include "terraria.fullname" .)) }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      {{- if and (eq .Values.serverType "tshock") .Values.terraria.tshockSettings }}
      - name: tshock-config
        secret:
          secretName: {{ include "terraria.fullname" . }}-tshock-config
      {{- end }}
      {{- if eq .Values.serverType "tshock" }}
      - name: tshock-plugins
      {{- if .Values.persistence.plugins.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.plugins.existingClaim | default (printf "%s-plugins" (include "terraria.fullname" .)) }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      - name: tshock-logs
      {{- if .Values.persistence.logs.enabled }}
        persistentVolumeClaim:
          claimName: {{ .Values.persistence.logs.existingClaim | default (printf "%s-logs" (include "terraria.fullname" .)) }}
      {{- else }}
        emptyDir: {}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
