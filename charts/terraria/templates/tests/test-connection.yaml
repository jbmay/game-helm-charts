apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "terraria.fullname" . }}-test-connection"
  labels:
{{ include "terraria.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args:  ['{{ include "terraria.fullname" . }}:{{ .Values.terraria.service.port }}']
  restartPolicy: Never
