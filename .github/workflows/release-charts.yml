name: Release Helm Charts

on:
  push:
    branches: [gh-pages]
    paths:
      - 'charts/**'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Add Helm repos for dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts || true

      # This action handles everything:
      # - Detects charts with version changes
      # - Packages them
      # - Creates GitHub releases
      # - Updates index.yaml on gh-pages branch
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # Also publish to GHCR for OCI support
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish changed charts to GHCR
        run: |
          for chart_dir in charts/*/; do
            chart_name=$(basename "$chart_dir")
            if [ -f "$chart_dir/Chart.yaml" ]; then
              version=$(grep '^version:' "$chart_dir/Chart.yaml" | awk '{print $2}')

              # Check if this version already exists in GHCR
              if ! helm pull oci://ghcr.io/${{ github.repository_owner }}/helm-charts/$chart_name --version $version 2>/dev/null; then
                echo "Publishing $chart_name version $version to GHCR..."
                helm dependency update "$chart_dir" || true
                helm package "$chart_dir" --destination .helm-packages
                helm push ".helm-packages/${chart_name}-${version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/helm-charts
              else
                echo "$chart_name version $version already exists in GHCR, skipping..."
              fi
            fi
          done
