name: Publish Helm Charts to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/publish-charts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
  workflow_dispatch:
    inputs:
      chart:
        description: 'Specific chart to publish (leave empty for all changed)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  REGISTRY_PATH: ${{ github.repository_owner }}/helm-charts

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.detect.outputs.charts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed charts
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.chart }}" ]; then
            echo "charts=[\"${{ github.event.inputs.chart }}\"]" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '^charts/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "charts=$CHANGED" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '^charts/' | cut -d'/' -f2 | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))') || CHANGED='[]'
            if [ "$CHANGED" = "[]" ]; then
              CHANGED=$(ls -d charts/*/ 2>/dev/null | xargs -n1 basename | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
            echo "charts=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Show detected charts
        run: echo "Publishing charts - ${{ steps.detect.outputs.charts }}"

  publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect-changes.outputs.charts) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if chart exists
        id: check
        run: |
          if [ -f "charts/${{ matrix.chart }}/Chart.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            VERSION=$(grep '^version:' charts/${{ matrix.chart }}/Chart.yaml | awk '{print $2}')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Helm
        if: steps.check.outputs.exists == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Log in to GHCR
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Update Helm dependencies
        if: steps.check.outputs.exists == 'true'
        run: |
          cd charts/${{ matrix.chart }}
          helm dependency update || true

      - name: Package chart
        if: steps.check.outputs.exists == 'true'
        run: |
          helm package charts/${{ matrix.chart }} --destination .helm-packages

      - name: Push chart to GHCR
        if: steps.check.outputs.exists == 'true'
        run: |
          helm push .helm-packages/${{ matrix.chart }}-${{ steps.check.outputs.version }}.tgz oci://${{ env.REGISTRY }}/${{ env.REGISTRY_PATH }}

      - name: Summary
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "### Published Chart" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Chart:** ${{ matrix.chart }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **OCI URL:** \`oci://${{ env.REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ matrix.chart }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install with:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "helm install my-release oci://${{ env.REGISTRY }}/${{ env.REGISTRY_PATH }}/${{ matrix.chart }} --version ${{ steps.check.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect-changes.outputs.charts) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint chart
        run: |
          helm lint charts/${{ matrix.chart }}

      - name: Template chart
        run: |
          cd charts/${{ matrix.chart }}
          helm dependency update || true
          helm template test . --debug
